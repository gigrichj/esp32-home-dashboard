; ESP32-S3-Touch-LCD-7 (Waveshare) — Home Dashboard
; https://docs.waveshare.com/ESP32-S3-Touch-LCD-7

[env:esp32-s3-touch-lcd-7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory / PSRAM (board has 8MB PSRAM, 16MB Flash) ---
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    ; PNGdec's internal double-line buffer (ucPixels[PNG_MAX_BUFFERED_PIXELS]
    ; in PNGdec.h) defaults to enough for only 320px-wide images. Despite
    ; the macro's name, it's used directly as the RAW BYTE SIZE of that
    ; buffer, not a pixel count -- the earlier value of 4096 here was a
    ; misread of that and only covered ~512px-wide images at worst case
    ; (4 bytes/pixel), which caused a silent openRAM failure against a
    ; real LL2 mission photo. 65536 bytes covers images up to ~8192px
    ; wide at worst case, matching the "several thousand pixels wide"
    ; case already noted for the JPEG size cap above. Safe to be generous
    ; here since (as of the stack-overflow fix) the PNG decoder object
    ; that embeds this buffer lives on PSRAM, not the task stack.
    -DPNG_MAX_BUFFERED_PIXELS=65536
    -Iinclude

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

; TEMPORARY DIAGNOSTIC BUILD -- enables ESP-IDF heap corruption detection
; (guard bytes around every allocation, checked on free) via pioarduino's
; custom_sdkconfig hybrid-mode feature, to catch a buffer overrun at the
; actual moment/call stack it happens, instead of the corruption only
; surfacing later as an unrelated crash deep in the WiFi/heap allocator
; (which is what we were seeing without this). Adds some CPU overhead to
; every malloc/free -- remove this custom_sdkconfig block once the real
; bug is found and fixed, since this project is sensitive to timing
; around the RGB display DMA.
custom_sdkconfig =
    CONFIG_HEAP_POISONING_LIGHT=y
    CONFIG_FMB_MASTER_TIMEOUT_MS_RESPOND=1000
    CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=2000
    ; Moves .text/.rodata execution into PSRAM instead of Flash (requires
    ; Octal PSRAM, already configured via board_build.psram_type=opi
    ; above). Tried per a well-documented issue on this exact board: the
    ; ESP32-S3's Flash and PSRAM share the same SPI1 bus, so any Flash
    ; write (NVS/Preferences save, etc.) locks the bus and stalls the
    ; CPU's instruction fetch, which interrupts the RGB LCD's bounce
    ; buffer refill and causes display flicker/glitching -- a plausible
    ; match for this project's still-unconfirmed flicker root cause,
    ; since it wouldn't require any particular page or fetch to trigger.
    ; NOTE: this moves code into PSRAM, competing with this project's
    ; existing PSRAM buffers (framebuffers, JSON parsing, JPEG decode) --
    ; worth watching free_psram at boot after this change.
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    ; Fix for the ISS fetch's intermittent "SSL - Memory allocation
    ; failed" at TLS handshake time. Confirmed on-device via diagnostic
    ; logging (heap_caps_get_largest_free_block): the largest contiguous
    ; internal-SRAM block was a rock-stable 40948 bytes across many
    ; separate fetch cycles, regardless of what else was running --
    ; not fragmentation from any specific fetch, but a structural
    ; ceiling (likely WiFi/BT driver buffers carving up internal SRAM at
    ; boot). mbedTLS's defaults (IN_CONTENT_LEN=16384 +
    ; OUT_CONTENT_LEN=16384 = 32KB, plus ~8-10KB session/cert overhead)
    ; land right around 40-42KB -- almost exactly that measured ceiling,
    ; explaining the failure by a razor-thin margin. These buffers only
    ; govern per-record chunk size during TLS streaming, not a cap on
    ; total response size, so this is safe even for this project's
    ; larger fetches (the ~187KB WV ClearSky image, etc.) -- those are
    ; already read via chunked loops (readHttpBodySafely() and similar)
    ; regardless of TLS record buffer size.
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8
    https://github.com/Hopperpop/Sgp4-Library.git
    bitbank2/JPEGDEC@^1.8.4
    bitbank2/PNGdec@^1.1.6
